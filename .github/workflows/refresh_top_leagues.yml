name: Refresh Top Leagues

on:
  # Fallback cron — GitHub may throttle this but external trigger keeps it reliable
  schedule:
    - cron: '0,15,30,45 * * * *'
  workflow_dispatch:  # Triggered externally every 15 min via cron-job.org

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run filter script
        env:
          PLAYLIST_URL: ${{ secrets.PLAYLIST_URL }}
        run: python filter_top_leagues.py

      - name: Check for changes
        id: git-check
        run: |
          if git diff --quiet top_leagues_spain.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changed
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add top_leagues_spain.json
          git commit -m "Update top_leagues_spain.json [skip ci]"
          git push
