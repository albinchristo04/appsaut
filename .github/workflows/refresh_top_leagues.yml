name: Refresh Top Leagues

on:
  schedule:
    # Run every 8 hours (00:00, 08:00, 16:00 UTC)
    - cron: '0 */1 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  refresh:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run filter script
        env:
          PLAYLIST_URL: ${{ secrets.PLAYLIST_URL }}
        run: python filter_top_leagues.py

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code top_leagues_spain.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push if changed
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add top_leagues_spain.json
          git commit -m "Update top_leagues_spain.json [skip ci]"
          git push
